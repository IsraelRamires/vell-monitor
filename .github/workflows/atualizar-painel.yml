# Mantém o painel online atualizado no GitHub Pages.
# A cada ~10 minutos: recupera o banco salvo, busca os eventos novos da BSC,
# recalcula as métricas, publica o painel e guarda o banco para a próxima vez.
name: Atualizar painel online

on:
  schedule:
    # minutos "quebrados": o GitHub atrasa ou pula horários redondos (:00, :10...) quando está cheio
    - cron: "4,14,24,34,44,54 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write          # para apagar cópias antigas do banco

concurrency:
  group: atualizar-painel
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Recuperar o banco da última atualização
        id: banco
        uses: actions/cache/restore@v4
        with:
          path: dados/vell.db
          key: vell-db-${{ github.run_id }}
          restore-keys: vell-db-

      - name: Primeira vez - baixar o banco inicial
        if: steps.banco.outputs.cache-matched-key == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dados
          gh release download banco-inicial -p vell.db -D dados \
            || echo "Sem banco inicial: o histórico será baixado da blockchain."

      - name: Coletar dados e gerar o painel
        env:
          VELL_RPC_ARCHIVE: ${{ secrets.VELL_RPC_ARCHIVE }}
          VELL_INTERVALO_SITE: "600"
          # endereço do site, código do AdSense e e-mail de contato (Settings > Secrets and variables > Actions > Variables)
          VELL_SITE_URL: ${{ vars.VELL_SITE_URL }}
          VELL_ADSENSE_ID: ${{ vars.VELL_ADSENSE_ID }}
          VELL_EMAIL_CONTATO: ${{ vars.VELL_EMAIL_CONTATO }}
        run: python gerar_site.py _site

      # só guarda quando tudo deu certo (execução cancelada ou com erro não estraga o banco salvo)
      - name: Guardar o banco para a próxima vez
        if: success() && hashFiles('dados/vell.db') != ''
        uses: actions/cache/save@v4
        with:
          path: dados/vell.db
          key: vell-db-${{ github.run_id }}

      - name: Apagar cópias antigas do banco
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --key vell-db- --sort created_at --order desc --limit 100 --json id --jq '.[2:][].id' \
            | xargs -r -n1 gh cache delete --repo "$GITHUB_REPOSITORY" || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar
        id: publicar
        uses: actions/deploy-pages@v4

      # O agendador do GitHub (schedule) atrasa muito ou não roda em repositórios novos.
      # Por isso cada atualização agenda a próxima: espera ~9 minutos e dispara de novo.
      # Se já houver outra atualização na fila, não dispara (evita duas correntes ao mesmo tempo).
      - name: Agendar a próxima atualização
        if: always() && !cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 540
          fila=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow atualizar-painel.yml --json databaseId,status                  --jq "[.[] | select(.databaseId != ${GITHUB_RUN_ID} and (.status == \"queued\" or .status == \"pending\" or .status == \"waiting\" or .status == \"in_progress\" or .status == \"requested\"))] | length")
          if [ "${fila:-0}" = "0" ]; then
            gh workflow run atualizar-painel.yml --repo "$GITHUB_REPOSITORY" --ref main
            echo "Próxima atualização disparada."
          else
            echo "Já existe outra atualização na fila; não disparei outra."
          fi
